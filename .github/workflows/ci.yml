name: Build Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-check:
    permissions:
      contents: read
    name: Build Check
    uses: ./.github/workflows/deploy.yml
    with:
      ipa_url: ""
      release: false
      testing_build: false
      caller_workflow: "ci"
    secrets: inherit 
