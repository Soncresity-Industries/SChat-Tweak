name: Deploy Build
permissions:
  contents: read
run-name: SChat ${{ github.event.inputs.release == 'true' && 'Release' || github.event.inputs.testing_build == 'true' && 'Testing Build' || 'Build' }} for ${{ github.event.inputs.ipa_url }}

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        default: ""
        description: "Direct link to the decrypted IPA"
        required: true
        type: string
      release:
        description: "Release the build"
        required: true
        type: boolean
      testing_build:
        description: "Release as Testing build"
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      ipa_url:
        required: true
        type: string
      release:
        required: false
        type: boolean
        default: true
      testing_build:
        required: true
        type: boolean
        default: true
      caller_workflow:
        required: false
        type: string

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-tweak:
    runs-on: macos-15

    env:
      DEB_DOWNLOADED: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download Tweak
        if: inputs.caller_workflow != 'ci'
        run: |
          set +e

          release_info=$(gh api --header 'Accept: application/vnd.github+json' repos/${{ github.repository }}/releases/latest)
          status_code=$(echo $release_info | jq -r ".status")

          if [ "$status_code" != "null" ]; then
            echo "No releases found or request failed, status code: $status_code"
            echo "DEB_DOWNLOADED=false" >> $GITHUB_ENV
            exit 0
          fi

          set -e

          release_version=$(echo "$release_info" | jq -r '.assets[] | select(.name | contains("iphoneos-arm64.deb")) | .name' | grep -o '_[0-9.]\+_' | tr -d '_')
          control_version=$(grep '^Version:' control | cut -d ' ' -f 2)

          if [ "$release_version" = "$control_version" ]; then
            echo "Versions match. Downloading DEB files..."
            echo "$release_info" | jq -r '.assets[] | select(.name | endswith("arm64.deb")) | .browser_download_url' | xargs -I {} curl -L -O {}
            echo "DEB_DOWNLOADED=true" >> $GITHUB_ENV
          else
            echo "Versions do not match. No files will be downloaded."
            echo "DEB_DOWNLOADED=false" >> $GITHUB_ENV
            exit 0
          fi

      - name: Check cache
        if: env.DEB_DOWNLOADED == 'false'
        run: echo upstream_heads=`git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        if: env.DEB_DOWNLOADED == 'false'
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        if: env.DEB_DOWNLOADED == 'false'
        uses: Randomblock1/theos-action@v1

      - name: Set GNU Make path
        run: |
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Build packages
        if: env.DEB_DOWNLOADED == 'false'
        run: make package

      - name: Set DEB path
        run: |
          if [ "${{ env.DEB_DOWNLOADED }}" == "true" ]; then
            echo "ROOTLESS_DEB_PATH=*-arm64.deb" >> $GITHUB_ENV
          else
            echo "ROOTLESS_DEB_PATH=packages/*-arm64.deb" >> $GITHUB_ENV
          fi

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: rootless package
          path: ${{ env.ROOTLESS_DEB_PATH }}

  build-ipa:
    if: inputs.caller_workflow != 'ci'
    runs-on: macos-15
    needs: build-tweak
    permissions:
      contents: read
    outputs:
      discord_version: ${{ steps.extract-version.outputs.discord_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Download Discord IPA
        run: |
          curl -L -o discord.ipa ${{ github.event.inputs.ipa_url || inputs.ipa_url }}

      - name: Download IPA icons
        run: |
          curl -L -o schat-ipa-icons.zip https://github.com/Soncresity-Industries/assets/raw/refs/heads/main/schat-ipa-icons.zip

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' control | cut -d ' ' -f 2)
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Run patcher
        run: |
          curl -L -o patcher https://github.com/Soncresity-Industries/SChat-ipa-patcher/releases/download/release-schat/patcher.mac-amd64
          chmod +x patcher
          ./patcher -d discord.ipa -o discord.ipa -i ./schat-ipa-icons.zip

      - name: Install cyan
        run: pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip Pillow

      - name: Inject tweak
        run: |
          cyan -duwsgq -i discord.ipa -o ${{ env.APP_NAME }}.ipa -f ${{ env.ROOTLESS_DEB_FILE_NAME }}

      - name: Extract Discord Version
        id: extract-version
        run: |
          unzip -q ${{ env.APP_NAME }}.ipa
          VERSION=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleShortVersionString | cut -d '"' -f 4)
        
          if [[ "${{ github.event.inputs.is_testflight || inputs.is_testflight }}" == "true" ]]; then
            BUILD=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleVersion | cut -d '"' -f 4)
            VERSION="${VERSION}_${BUILD}"
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi
          # Save for current job
          echo "DISCORD_VERSION=$VERSION" >> $GITHUB_ENV
          # Save as job output for other jobs
          echo "discord_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename IPA file
        run: |
          mv "${{ env.APP_NAME }}.ipa" "${{ env.APP_NAME }}-${{ env.DISCORD_VERSION }}.ipa"

      - name: Upload ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ env.APP_NAME }}-${{ env.DISCORD_VERSION }}.ipa

  release-app:
    if: |
      inputs.caller_workflow != 'ci' && 
      (github.event.inputs.release == 'true' || inputs.release == true)
    runs-on: macos-15
    needs: build-ipa
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' control | cut -d ' ' -f 2)
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-ipa.outputs.discord_version }}
          files: |
            ${{ env.ROOTLESS_DEB_FILE_NAME }}
            ${{ env.APP_NAME }}-${{ needs.build-ipa.outputs.discord_version }}.ipa
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE }}
          fail_on_unmatched_files: true
          token: ${{ env.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-website-downloads:
    runs-on: macos-15
    needs: release-app
    continue-on-error: true
    permissions:
      contents: write
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Checkout schat_ios branch of Website-Downloads
        uses: actions/checkout@v4
        with:
          repository: Soncresity-Industries/Website-Downloads
          ref: schat_ios
          token: ${{ secrets.GITHUB_TOKEN }}
          path: website-downloads

      - name: Extract App Name
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Copy renamed IPA to other repo
        run: |
          cp -f "${{ env.APP_NAME }}-${{ needs.build-ipa.outputs.discord_version }}.ipa" website-downloads/
        
      - name: Commit and push to schat_ios branch
        run: |
          cd website-downloads
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add ${{ env.APP_NAME }}-${{ needs.build-ipa.outputs.discord_version }}.ipa"
          git push origin schat_ios

  app-repo-rel:
    if: |
      inputs.caller_workflow != 'ci' && 
      (github.event.inputs.release == 'true' || inputs.release == true)
    continue-on-error: true
    runs-on: macos-15
    needs: release-app
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract App Name
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          echo "APP_NAME=$NAME" >> $GITHUB_ENV
          
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ipa

      - name: Update app-repo.json (Release)
        run: |
          unzip -q ${{ env.APP_NAME }}-${{ needs.build-ipa.outputs.discord_version }}.ipa
          VERSION=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleShortVersionString | cut -d '"' -f 4)
          APP_INDEX=0
          
          DATE=$(date -u +"%Y-%m-%d")
          IPA_SIZE=$(ls -l ${{ env.APP_NAME }}-${{ needs.build-ipa.outputs.discord_version }}.ipa | awk '{print $5}')
          DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/v$VERSION/${{ env.APP_NAME }}-${{ needs.build-ipa.outputs.discord_version }}.ipa
          NEW_ENTRY=$(jq -n --arg version "$VERSION" --arg date "$DATE" --arg size "$IPA_SIZE" --arg downloadURL "$DOWNLOAD_URL" '{version: $version, date: $date, size: ($size | tonumber), downloadURL: $downloadURL}')
          jq --argjson newEntry "$NEW_ENTRY" --argjson index "$APP_INDEX" '.apps[$index].versions |= [$newEntry] + .' app-repo.json > temp.json && mv temp.json app-repo.json

      - uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "Update app-repo.json (Release)"
          add: app-repo.json

  publish-testing:
    runs-on: macos-15
    if: |
      inputs.caller_workflow != 'ci' && 
      (github.event.inputs.testing_build == 'true' || inputs.testing_build == true)
    needs: build-ipa
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
        
      - name: Push IPA to builds branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin
          git checkout -B testing-builds
          git add -f ${{ env.APP_NAME }}-${{ needs.build-ipa.outputs.discord_version }}.ipa
          git commit -m "Update testing build"
          git push -f origin testing-builds

  app-repo-t:
    continue-on-error: true
    runs-on: macos-15
    permissions:
      contents: write
    needs: publish-testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract App Name
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          echo "APP_NAME=$NAME" >> $GITHUB_ENV
          
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ipa

      - name: Update app-repo-testing.json
        run: |
          unzip -q ${{ env.APP_NAME }}-${{ needs.build-ipa.outputs.discord_version }}.ipa
          VERSION=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleShortVersionString | cut -d '"' -f 4)
          APP_INDEX=0
          
          DATE=$(date -u +"%Y-%m-%d")
          IPA_SIZE=$(ls -l ${{ env.APP_NAME }}-${{ needs.build-ipa.outputs.discord_version }}.ipa | awk '{print $5}')
          DOWNLOAD_URL=https://github.com/${{ github.repository }}/raw/refs/heads/testing-builds/${{ env.APP_NAME }}-${{ needs.build-ipa.outputs.discord_version }}.ipa
          NEW_ENTRY=$(jq -n --arg version "$VERSION" --arg date "$DATE" --arg size "$IPA_SIZE" --arg downloadURL "$DOWNLOAD_URL" '{version: $version, date: $date, size: ($size | tonumber), downloadURL: $downloadURL}')
          jq --argjson newEntry "$NEW_ENTRY" --argjson index "$APP_INDEX" '.apps[$index].versions |= [$newEntry] + .' app-repo-testing.json > temp.json && mv temp.json app-repo-testing.json

      - uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "Update app-repo-testing.json"
          add: app-repo-testing.json
